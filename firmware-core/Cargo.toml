[package]
name = "firmware-core"
version = "0.1.0"
edition = "2024"
description = "Board policy, input handling and display geometry without hardware access."
license = "MIT OR Apache-2.0"
publish = false

[lib]
test = false
bench = false

[dependencies]
fusb302-pd.workspace = true
libm.workspace = true
microfft = { workspace = true, features = ["size-1024"] }
pd-protocol.workspace = true
qc-protocol.workspace = true
usbpd.workspace = true

[dev-dependencies]
anyhow.workspace = true
embedded-graphics.workspace = true
image-webp.workspace = true
u8g2-fonts.workspace = true
