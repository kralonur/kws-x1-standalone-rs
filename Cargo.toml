[workspace]
resolver = "3"
members = ["firmware", "firmware-core", "firmware-image", "firmware-pack", "flasher", "fusb302-pd"]
default-members = ["firmware-core", "fusb302-pd"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
hidapi = "2.6.7"
# The firmware links no allocator: members enable `with-alloc` where needed.
miniz_oxide = { version = "0.9.1", default-features = false }
object = "0.40.0"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"
embassy-executor = "0.10.0"
embassy-hc32 = { git = "https://github.com/kralonur/hc32f460-embassy-rs", rev = "bca14239e0adf13a9177d0468d7110b16951ecd5" }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-graphics = "0.8.2"
embedded-hal-async = "1.0.0"
firmware-core = { path = "firmware-core" }
firmware-image = { path = "firmware-image" }
fusb302-pd = { path = "fusb302-pd" }
hc32f460-pac = { git = "https://github.com/kralonur/hc32f460-embassy-rs", rev = "bca14239e0adf13a9177d0468d7110b16951ecd5" }
panic-halt = "1.0.0"
pd-protocol = { git = "https://github.com/kralonur/embedded-charging-protocols-rs", rev = "8bb4a12936ed642da6c886587df36bf2e08c6632" }
qc-protocol = { git = "https://github.com/kralonur/embedded-charging-protocols-rs", rev = "8bb4a12936ed642da6c886587df36bf2e08c6632" }
u8g2-fonts = "0.8.0"
usbpd = { git = "https://github.com/kralonur/usbpd", rev = "9c1325e1ecf6be5f5f53be656ae3658dd7131101" }
usbpd-traits = { git = "https://github.com/kralonur/usbpd", rev = "9c1325e1ecf6be5f5f53be656ae3658dd7131101" }

# Size optimization keeps the application below the preserved graphics bank.
# This is the source firmware's release profile, not a new hardware qualification.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
