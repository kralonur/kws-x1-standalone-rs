[workspace]
resolver = "3"
members = ["firmware", "firmware-core", "firmware-image", "firmware-pack", "flasher", "fusb302-pd"]
default-members = ["firmware-core", "fusb302-pd"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
hidapi = "2.6.7"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"
embassy-executor = "0.10.0"
embassy-hc32 = { git = "https://github.com/kralonur/hc32f460-embassy-rs", rev = "80da2a6abee50e4207644acb84b14a4694e44e67" }
embassy-sync = "0.6.2"
embassy-time = "0.5.1"
embedded-graphics = "0.8.2"
embedded-hal-async = "1.0.0"
firmware-core = { path = "firmware-core" }
firmware-image = { path = "firmware-image" }
fusb302-pd = { path = "fusb302-pd" }
hc32f460-pac = { git = "https://github.com/kralonur/hc32f460-embassy-rs", rev = "80da2a6abee50e4207644acb84b14a4694e44e67" }
panic-halt = "1.0.0"
pd-protocol = { git = "https://github.com/kralonur/embedded-charging-protocols-rs", rev = "0796747706551713ff10620fce8c9617a98b5c78" }
u8g2-fonts = "0.8.0"
usbpd = { git = "https://github.com/kralonur/usbpd", rev = "13e747ed116874d30ac54b58ff6d104cbe6b9ec3" }
usbpd-traits = { git = "https://github.com/kralonur/usbpd", rev = "13e747ed116874d30ac54b58ff6d104cbe6b9ec3" }

# Size optimization keeps the application below the preserved graphics bank.
# This is the source firmware's release profile, not a new hardware qualification.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
