[workspace]
resolver = "3"
members = [
    "firmware",
    "firmware-core",
    "firmware-image",
    "firmware-pack",
    "flasher",
    "fusb302-pd",
]
default-members = ["firmware-core", "fusb302-pd"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
embassy-executor = "0.10.0"
embassy-hc32 = { git = "https://github.com/kralonur/hc32f460-embassy-rs", rev = "08a2603185d5acd05fda156e9cef468d47526be1" }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-graphics = "0.8.2"
embedded-hal-async = "1.0.0"
firmware-core = { path = "firmware-core" }
firmware-image = { path = "firmware-image" }
fusb302-pd = { path = "fusb302-pd" }
hc32f460-pac = { git = "https://github.com/kralonur/hc32f460-embassy-rs", rev = "08a2603185d5acd05fda156e9cef468d47526be1" }
hidapi = "2.6.7"
image-webp = "0.2.4"
libm = "0.2.16"
lzma-rust2 = "0.22.0"
# Only the 1024-point FFT tables: members enable `size-1024`.
microfft = { version = "0.6.0", default-features = false }
object = "0.40.0"
panic-halt = "1.0.0"
pd-protocol = { git = "https://github.com/kralonur/embedded-charging-protocols-rs", rev = "2c3d511cb7214f1db9f5e3528900e1fd9d1bc323" }
qc-protocol = { git = "https://github.com/kralonur/embedded-charging-protocols-rs", rev = "2c3d511cb7214f1db9f5e3528900e1fd9d1bc323" }
scp-protocol = { git = "https://github.com/kralonur/embedded-charging-protocols-rs", rev = "2c3d511cb7214f1db9f5e3528900e1fd9d1bc323" }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
u8g2-fonts = "0.8.0"
usbpd = { git = "https://github.com/kralonur/usbpd", rev = "16b13a23dafad6c5dd0c18801ee978b785730f83" }
usbpd-traits = { git = "https://github.com/kralonur/usbpd", rev = "16b13a23dafad6c5dd0c18801ee978b785730f83" }

# Size optimization keeps the application below the preserved graphics bank.
# This is the source firmware's release profile, not a new hardware qualification.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
